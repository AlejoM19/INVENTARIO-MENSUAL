<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso restringido · Inventario mensual</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F6F4F1;color:#1A1714;font-family:'Inter',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{max-width:480px;text-align:center}
  .logo{font-weight:800;letter-spacing:.30em;font-size:15px;color:#1A1714;margin-bottom:28px}
  h1{font-size:23px;margin:0 0 12px;letter-spacing:-.02em}
  p{color:#8A8177;line-height:1.65;font-size:15px;margin:0 0 10px}
  a{display:inline-block;margin-top:22px;background:#B4571C;color:#fff;text-decoration:none;
    padding:11px 22px;border-radius:8px;font-weight:600;font-size:14px}
  a:hover{filter:brightness(1.07)}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">TEMPLE</div>
    <h1>Acceso restringido</h1>
    <p>Esta herramienta es de uso interno y está limitada a las cuentas corporativas autorizadas.</p>
    <p>Si crees que deberías tener acceso, escribe al área de inventarios.</p>
    <a href="/.auth/logout">Entrar con otra cuenta</a>
  </div>
</body>
</html>
